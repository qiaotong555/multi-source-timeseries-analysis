[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mtsa-agent"
version = "0.3.0"
description = "多源时序数据量化分析与可视化 Agent（课题 12 / S06）"
readme = "README.md"
# 许可证：Apache-2.0（PEP 639 的 SPDX 写法要求 setuptools>=77，已在 build-system 声明）
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# 3.11 不可用：numpy>=2.5 与 scipy>=1.18 都要求 Python >=3.12（CI 实测 3.11 装不上）。
# 下界是 2026-10-24 实际跑通全量测试的版本；更低的版本未验证，不承诺兼容。
dependencies = [
    "pandas>=3.0,<4",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "statsmodels>=0.15,<0.16",
    "plotly>=7.1,<8",
    "kaleido>=1.4,<2",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
# 只有生成 Word 演示文档（scripts/make_*.py）才需要，运行分析与报告不需要。
docx = ["python-docx>=1.2"]
# 只处理 CSV 时不需要；读 Excel / Parquet / HDF5 才装
io = ["openpyxl>=3.1", "pyarrow>=25", "h5py>=3.16"]
# 只在跑 HTTP 薄壳（`mtsa-api`）时需要；分析内核不依赖 Web 框架
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# 跑全量测试所需：httpx 供 fastapi.testclient 用，fastapi / python-multipart
# 供 test_api.py 直接 import——不写在这里，只装 dev 的 CI 会在收集阶段就报
# ModuleNotFoundError（[api] 是运行时功能开关，不该同时兼任"测试依赖"）。
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "python-multipart>=0.0.9"]

[project.scripts]
mtsa = "mtsa.cli:main"
# 垫片：没装 [api] 时给一句人话，而不是 ModuleNotFoundError
mtsa-api = "mtsa.api_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mtsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
