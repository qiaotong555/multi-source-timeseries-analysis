[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtsa"
version = "0.1.0"
description = "多源时序数据量化分析与可视化 Agent（课题 12 / S06）"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mtsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
