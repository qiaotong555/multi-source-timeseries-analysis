name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装项目与测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docx]"

      - name: 准备浏览器（PNG 导出需要真实 Chrome）
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: 指向该 Chrome
        run: echo "BROWSER_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: 安装中文字体（图表与报告是中文）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 用项目自己的入口：逐文件独立进程 + 超时，与本机口径一致
      - name: 逐文件跑测试
        run: python run_tests.py --timeout 300

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-py${{ matrix.python }}
          path: evals/test_logs/

  docker:
    name: docker build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t mtsa:ci .

      - name: 镜像可启动
        run: docker run --rm mtsa:ci list-scenes

      - name: 容器内跑一次真实分析
        run: |
          mkdir -p out
          docker run --rm --user root \
            -v "$PWD/fixtures:/data:ro" \
            -v "$PWD/out:/out" \
            mtsa:ci run --scene weather \
              --input /data/weather_short_v1.csv \
              --question "分析温度趋势与异常，并说明数据质量" \
              --out /out/run
          grep -q '"status": "succeeded"' out/run/result.json
          test -f out/run/report.md
          echo "容器内分析与报告生成通过"

  package:
    name: build wheel & sdist
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 构建分发包
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 校验分发包可安装并能跑
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/mtsa list-scenes

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
