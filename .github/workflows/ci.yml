name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装项目与测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docx]"

      - name: 准备浏览器（PNG 导出需要真实 Chrome）
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: 指向该 Chrome
        run: echo "BROWSER_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: 安装中文字体（图表与报告是中文）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 用项目自己的入口：逐文件独立进程 + 超时，与本机口径一致
      - name: 逐文件跑测试
        run: python run_tests.py --timeout 300

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-py${{ matrix.python }}
          path: evals/test_logs/

  docker:
    name: docker build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t mtsa:ci .

      - name: 镜像可启动
        run: docker run --rm mtsa:ci list-scenes

      - name: 容器内跑一次真实分析
        run: |
          mkdir -p out
          docker run --rm --user root \
            -v "$PWD/fixtures:/data:ro" \
            -v "$PWD/out:/out" \
            mtsa:ci run --scene weather \
              --input /data/weather_short_v1.csv \
              --question "分析温度趋势与异常，并说明数据质量" \
              --out /out/run
          grep -q '"status": "succeeded"' out/run/result.json
          test -f out/run/report.md
          echo "容器内分析与报告生成通过"

      # 镜像要能"当服务用"，不只是当命令行。这一步兜住三个容易漏的地方：
      #   1. 镜像里到底装没装 [api] extra（fastapi / uvicorn / python-multipart）
      #   2. entrypoint.sh 的 `api` 分支通不通
      #   3. 容器内产物目录能不能写——fixtures 是只读挂在 /data 上的，
      #      默认的 ./artifacts/api 会落到 /data 里直接写失败，所以显式给 MTSA_API_OUT。
      - name: 镜像能当服务用（api 入口）
        run: |
          docker run -d --name mtsa-api \
            -e MTSA_API_TOKEN=ci -e MTSA_API_OUT=/tmp/api-out \
            -v "$PWD/fixtures:/data:ro" -p 8000:8000 mtsa:ci api

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 1
            if [ "$i" = "30" ]; then echo "api 30s 内未就绪"; docker logs mtsa-api; exit 1; fi
          done

          # 没带 token 必须被拒：默认无鉴权的服务等于没门
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H 'Content-Type: application/json' -d '{}' \
                 http://127.0.0.1:8000/api/v1/analyses)
          test "$code" = "401" || { echo "无 token 应为 401，实际 $code"; exit 1; }

          # 一次真实分析：异步提交 202 → 轮询状态 → 取结果与产物
          created=$(curl -fsS -H "X-API-Token: ci" -H 'Content-Type: application/json' \
            -d '{"input_path":"/data/weather_short_v1.csv","question":"分析温度趋势与异常","planner":"rule"}' \
            http://127.0.0.1:8000/api/v1/analyses)
          echo "$created"
          run_id=$(printf '%s' "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')
          test -n "$run_id"

          status=""; n=0
          for i in $(seq 1 120); do
            body=$(curl -fsS -H "X-API-Token: ci" "http://127.0.0.1:8000/api/v1/analyses/$run_id")
            status=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            n=$(printf '%s' "$body" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["artifacts"]))')
            echo "[$i] status=$status artifacts=$n"
            case "$status" in succeeded|failed) break ;; esac
            sleep 2
          done
          test "$status" = "succeeded" || { echo "分析未成功：$body"; docker logs mtsa-api; exit 1; }
          test "$n" -ge 5 || { echo "产物只有 $n 个，太少"; exit 1; }

          # 不用 curl | grep -q：grep 提前退出会让 curl 报 23，pipefail 下等于假失败
          curl -fsS -H "X-API-Token: ci" -o /tmp/result.json \
            "http://127.0.0.1:8000/api/v1/analyses/$run_id/result"
          test -s /tmp/result.json
          grep -q '"status": "succeeded"' /tmp/result.json
          curl -fsS -H "X-API-Token: ci" -o /tmp/report.md \
            "http://127.0.0.1:8000/api/v1/analyses/$run_id/artifacts/report.md"
          test -s /tmp/report.md
          docker exec mtsa-api test -f "/tmp/api-out/$run_id/result.json"
          echo "api 服务路径通过：鉴权 / 异步提交 / 轮询 / result / 产物下载"

      - name: api 容器收尾
        if: always()
        run: |
          docker logs mtsa-api 2>&1 | tail -40 || true
          docker rm -f mtsa-api || true

  package:
    name: build wheel & sdist
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 构建分发包
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 校验分发包可安装并能跑
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/mtsa list-scenes

      # 陌生人的最短路径：装好 wheel，在仓库之外跑一条命令
      - name: 装完就能跑（不支持从仓库取数据）
        run: |
          cd /tmp
          /tmp/venv/bin/mtsa demo --out /tmp/demo_out
          grep -q '"status": "succeeded"' /tmp/demo_out/result.json
          test -f /tmp/demo_out/report.md
          test -f /tmp/demo_out/input.csv
          echo "陌生人路径通过：无仓库、无 fixtures、无模型、无网络"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
